<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desbloquear</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .caixa {
            width: 100%;
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
        }

        p {
            font-size: 17px;
            line-height: 1.5;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        button {
            width: 100%;
            min-height: 55px;
            padding: 14px 20px;

            border: none;
            border-radius: 12px;

            background: #667eea;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        button:active {
            transform: scale(0.98);
        }

        .concluido {
            background: #28a745 !important;
        }

        #botaoFinalizar {
            margin-top: 20px;
            background: #ff9800;
            display: none;
        }

        #botaoVoltar {
            background: #28a745;
            display: none;
        }

        #telaEspera,
        #telaFinal {
            display: none;
        }

        #contador {
            font-size: 45px;
            font-weight: bold;
            margin: 25px 0;
            color: #667eea;
        }

        /* Tela de carregamento de 1 segundo */
        #telaCarregamento {
            display: none;
        }

        .spinner {
            width: 55px;
            height: 55px;
            margin: 25px auto;

            border: 6px solid #ddd;
            border-top: 6px solid #667eea;
            border-radius: 50%;

            animation: girar 1s linear infinite;
        }

        @keyframes girar {
            100% {
                transform: rotate(360deg);
            }
        }

        .frase {
            background: #f1f1f1;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;

            font-size: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        #mensagemCopiado {
            color: #28a745;
            font-weight: bold;
            margin-top: 15px;
        }

        /* Ajustes para celulares */
        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .caixa {
                padding: 25px 18px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            button {
                min-height: 58px;
                font-size: 16px;
            }

            #contador {
                font-size: 40px;
            }
        }

        /* Celulares bem pequenos */
        @media (max-width: 380px) {

            body {
                padding: 8px;
            }

            .caixa {
                padding: 22px 14px;
            }

            h1 {
                font-size: 22px;
            }

            button {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- TELA INICIAL -->
    <div class="caixa" id="telaInicial">

        <h1>Desbloquear</h1>

        <p>
            Clique nos três botões para continuar.
        </p>

        <div class="botoes">

            <button id="botao1" onclick="iniciarPasso(1)">
                Botão 1
            </button>

            <button id="botao2" onclick="iniciarPasso(2)">
                Botão 2
            </button>

            <button id="botao3" onclick="iniciarPasso(3)">
                Botão 3
            </button>

        </div>

        <button id="botaoFinalizar" onclick="finalizar()">
            Finalizar
        </button>

    </div>


    <!-- TELA DE CARREGAMENTO -->
    <div class="caixa" id="telaCarregamento">

        <h1>Carregando...</h1>

        <div class="spinner"></div>

        <p>
            Aguarde um momento...
        </p>

    </div>


    <!-- TELA DE ESPERA -->
    <div class="caixa" id="telaEspera">

        <h1>Aguarde</h1>

        <p>
            O processo está acontecendo...
        </p>

        <div id="contador">
            15
        </div>

        <p>
            segundos restantes
        </p>

        <button id="botaoVoltar" onclick="voltarInicio()">
            Voltar
        </button>

    </div>


    <!-- TELA FINAL -->
    <div class="caixa" id="telaFinal">

        <h1>Concluído!</h1>

        <div class="frase" id="frase">
            Parabéns! Você concluiu todos os passos.
        </div>

        <button onclick="copiarFrase()">
            Copiar
        </button>

        <p id="mensagemCopiado"></p>

    </div>

</div>


<script>

    let passoAtual = 0;

    let passosConcluidos = {
        1: false,
        2: false,
        3: false
    };


    // Inicia um botão
    function iniciarPasso(numero) {

        // Se já foi concluído, não faz nada
        if (passosConcluidos[numero]) {
            return;
        }

        passoAtual = numero;

        // Esconde a tela inicial
        document.getElementById("telaInicial").style.display = "none";

        // Mostra o carregamento
        document.getElementById("telaCarregamento").style.display = "block";

        // Carregamento de 1 segundo
        setTimeout(function() {

            // Esconde carregamento
            document.getElementById("telaCarregamento").style.display = "none";

            // Mostra tela de espera
            document.getElementById("telaEspera").style.display = "block";

            iniciarContagem();

        }, 1000);
    }


    // Contagem de 15 segundos
    function iniciarContagem() {

        let tempo = 15;

        document.getElementById("contador").textContent = tempo;

        document.getElementById("botaoVoltar").style.display = "none";

        let intervalo = setInterval(function() {

            tempo--;

            document.getElementById("contador").textContent = tempo;

            if (tempo <= 0) {

                clearInterval(intervalo);

                document.getElementById("contador").textContent = "✓";

                document.getElementById("botaoVoltar").style.display = "block";
            }

        }, 1000);
    }


    // Voltar para a tela inicial
    function voltarInicio() {

        // Marca o botão como concluído
        passosConcluidos[passoAtual] = true;

        let botao = document.getElementById("botao" + passoAtual);

        botao.classList.add("concluido");

        botao.textContent = "✓ Botão " + passoAtual;

        // Esconde tela de espera
        document.getElementById("telaEspera").style.display = "none";

        // Mostra tela inicial
        document.getElementById("telaInicial").style.display = "block";

        // Verifica se todos foram concluídos
        verificarFinalizacao();
    }


    // Verifica se os três botões foram concluídos
    function verificarFinalizacao() {

        if (
            passosConcluidos[1] &&
            passosConcluidos[2] &&
            passosConcluidos[3]
        ) {

            document.getElementById("botaoFinalizar").style.display = "block";
        }
    }


    // Finalizar
    function finalizar() {

        document.getElementById("telaInicial").style.display = "none";

        document.getElementById("telaFinal").style.display = "block";
    }


    // Copiar frase
    function copiarFrase() {

        let frase = document.getElementById("frase").textContent;

        navigator.clipboard.writeText(frase)
            .then(function() {

                document.getElementById("mensagemCopiado").textContent =
                    "✓ Frase copiada!";

            })
            .catch(function() {

                document.getElementById("mensagemCopiado").textContent =
                    "Não foi possível copiar.";

            });
    }

</script>

</body>
</html>
